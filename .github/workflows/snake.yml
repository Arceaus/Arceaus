name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C5C9E&color_dots=%23F3F1F7,%23DDD7E8,%23C4B5D9,%23A995C5,%238B72AD
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C9B6E4&color_dots=%2317151C,%23302A38,%2350445C,%2375638A,%239C84B8

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
